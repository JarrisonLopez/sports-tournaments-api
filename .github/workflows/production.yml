name: Production Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  production:
    name: Build, Tests and Production Coverage
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (Sports)
        run: npm ci

      - name: Install dependencies (Object Storage)
        run: npm ci --prefix object-storage

      - name: Build Sports API
        run: npm run build

      - name: Build Object Storage
        run: npm run build --prefix object-storage

      - name: Run automated tests
        run: npm test

      - name: Validate production coverage
        run: npm run test:coverage:production