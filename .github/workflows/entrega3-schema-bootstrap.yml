name: Entrega 3 - Cloud SQL Schema Bootstrap

# Inspecciona el esquema y, solo con confirmación distinta, puede crearlo en una base vacía.
# ADOPT está preparado y deshabilitado: Terraform deja backup_configuration.enabled
# y binary_log_enabled en false. Una confirmación de texto no demuestra un respaldo
# recuperable, y este repositorio no tiene una prueba de restauración.
# 127.0.0.1 no identifica la instancia. La clasificación accion=apply no autoriza
# por sí sola la escritura. sports-demo-provision tiene roles/owner; un rol de IAM
# no es un GRANT de MySQL.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operación de esquema'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - adopt
      confirmation:
        description: 'Escribe PLAN, APPLY:sports_db o ADOPT:sports_db'
        required: true
        type: string
      source_sha:
        description: 'Commit completo de feature/canary-seguimiento-3. El CLI no se toma de main.'
        required: true
        type: string

concurrency:
  group: entrega3-gcp-terraform
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  schema-plan:
    name: Schema bootstrap operation
    if: github.ref == 'refs/heads/main' && github.repository == 'JarrisonLopez/sports-tournaments-api' && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No agregar environment: alteraría el subject OIDC autorizado actualmente.
    env:
      PROJECT_ID: sports-tournaments-multicloud
      REGION: us-central1
      SQL_INSTANCE: sports-demo-mysql
      DB_NAME: sports_db
      DB_USER: sports_user
      SECRET_ID: sports-demo-db-password
      TF_STATE_BUCKET: sports-tournaments-multicloud-tfstate
      TF_STATE_PREFIX: entrega3/main
      WIF_PROVIDER: projects/171179411205/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
      PROVISION_SA: sports-demo-provision@sports-tournaments-multicloud.iam.gserviceaccount.com
      DB_HOST: '127.0.0.1'
      DB_PORT: '13306'
      DB_BOOTSTRAP_ALLOW_HOST: '127.0.0.1'
      EXPECTED_SCHEMA_VERSION: 001-initial
      EXPECTED_SCHEMA_CHECKSUM: e28e282749f72504129f8aeb1c52f5de7d8ac79cdd7a9d2a125dcd4520581633

    steps:
      - name: Exigir ejecución manual autorizada
        env:
          BOOTSTRAP_OPERATION: ${{ inputs.operation }}
          BOOTSTRAP_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${GITHUB_REPOSITORY}" = 'JarrisonLopez/sports-tournaments-api'
          # BEGIN accept_confirmation
          accept_confirmation() {
            if [ "${DB_NAME}" != "sports_db" ]; then
              return 1
            fi
            pair="${BOOTSTRAP_OPERATION}"$'\n'"${BOOTSTRAP_CONFIRMATION}"
            case "${pair}" in
              $'plan\nPLAN') return 0 ;;
              $'apply\nAPPLY:sports_db') return 0 ;;
              $'adopt\nADOPT:sports_db') return 0 ;;
              *) return 1 ;;
            esac
          }
          # END accept_confirmation
          if ! accept_confirmation; then
            echo 'Confirmación inválida para la operación y la base autorizada.' >&2
            exit 1
          fi
          echo "BOOTSTRAP_OPERATION=${BOOTSTRAP_OPERATION}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Usar el commit Canary autorizado para el esquema
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha debe ser el commit completo de Canary." >&2
            exit 1
          fi
          git fetch --no-tags https://github.com/JarrisonLopez/sports-tournaments-api.git feature/canary-seguimiento-3
          if ! git merge-base --is-ancestor "${SOURCE_SHA}" FETCH_HEAD; then
            echo "El SHA no pertenece a feature/canary-seguimiento-3." >&2
            exit 1
          fi
          git checkout --detach "${SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -f src/schema/bootstrap-cli.ts
          test -f src/schema/canonical-schema.ts
          test -f package-lock.json
          echo "schema-source=${SOURCE_SHA}"

      - name: Autenticación GCP mediante WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.PROVISION_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Terraform para leer estado existente
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Leer outputs del estado Terraform sin aplicar cambios
        id: state
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure -no-color \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"
          connection_name="$(terraform output -raw cloud_sql_connection_name)"
          secret_id="$(terraform output -raw db_password_secret_id)"
          expected="${PROJECT_ID}:${REGION}:${SQL_INSTANCE}"
          if [ -z "${connection_name}" ] || [ "${connection_name}" != "${expected}" ]; then
            echo 'La instancia del estado Terraform no coincide con la configuración autorizada.' >&2
            exit 1
          fi
          if [ "${secret_id}" != "${SECRET_ID}" ]; then
            echo 'El identificador del secreto no coincide con el estado Terraform.' >&2
            exit 1
          fi
          echo "connection_name=${connection_name}" >> "${GITHUB_OUTPUT}"
          echo 'Estado Terraform: identificadores coherentes.'

      - name: Comprobar instancia y base mediante Cloud SQL Admin API
        env:
          TF_CONNECTION_NAME: ${{ steps.state.outputs.connection_name }}
        run: |
          set -euo pipefail
          expected="${PROJECT_ID}:${REGION}:${SQL_INSTANCE}"
          test -n "${TF_CONNECTION_NAME}"
          test "${TF_CONNECTION_NAME}" = "${expected}"
          instance_json="$(gcloud sql instances describe "${SQL_INSTANCE}" \
            --project="${PROJECT_ID}" --format=json)"
          test "$(jq -er '.connectionName' <<< "${instance_json}")" = "${expected}"
          test "$(jq -er '.project' <<< "${instance_json}")" = "${PROJECT_ID}"
          test "$(jq -er '.name' <<< "${instance_json}")" = "${SQL_INSTANCE}"
          test "$(jq -er '.region' <<< "${instance_json}")" = "${REGION}"
          test "$(jq -er '.state' <<< "${instance_json}")" = 'RUNNABLE'
          test "$(jq -er '.databaseVersion' <<< "${instance_json}")" = 'MYSQL_8_4'
          db_json="$(gcloud sql databases describe "${DB_NAME}" \
            --instance="${SQL_INSTANCE}" --project="${PROJECT_ID}" --format=json)"
          test "$(jq -er '.name' <<< "${db_json}")" = "${DB_NAME}"
          test "$(jq -er '.charset' <<< "${db_json}")" = 'utf8mb4'
          test "$(jq -er '.collation' <<< "${db_json}")" = 'utf8mb4_unicode_ci'
          active="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)' | tr -d '\r')"
          if [ "${active}" != "${PROVISION_SA}" ]; then
            echo 'La identidad activa no es la cuenta de aprovisionamiento.' >&2
            exit 1
          fi
          backup_enabled="$(jq -r '.settings.backupConfiguration.enabled // "absent"' <<< "${instance_json}")"
          binary_log="$(jq -r '.settings.backupConfiguration.binaryLogEnabled // "absent"' <<< "${instance_json}")"
          case "${backup_enabled}" in true|false|absent) ;; *) backup_enabled="unrecognized" ;; esac
          case "${binary_log}" in true|false|absent) ;; *) binary_log="unrecognized" ;; esac
          {
            echo "DB_BOOTSTRAP_EXPECT_INSTANCE=${expected}"
            echo "BACKUP_ENABLED=${backup_enabled}"
            echo "BINARY_LOG_ENABLED=${binary_log}"
          } >> "${GITHUB_ENV}"
          echo 'Instancia, región, versión y base verificadas por metadatos.'

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar CLI del bootstrap
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Descargar y comprobar Cloud SQL Auth Proxy v2.26.3
        run: |
          set -euo pipefail
          proxy_bin="${RUNNER_TEMP}/cloud-sql-proxy"
          curl --fail --silent --show-error --location --retry 3 \
            'https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.26.3/cloud-sql-proxy.linux.amd64' \
            --output "${proxy_bin}"
          printf '%s  %s\n' \
            '5533a05cdbf12f8a0cb46db34c775847a496e181d47f863284d3d02b0fad49fa' \
            "${proxy_bin}" | sha256sum --check --status
          chmod 700 "${proxy_bin}"
          test -x "${proxy_bin}"
          "${proxy_bin}" --version

      - name: Conectar proxy temporal y ejecutar la operación autorizada
        env:
          TF_CONNECTION_NAME: ${{ steps.state.outputs.connection_name }}
        run: |
          set -euo pipefail
          expected="${PROJECT_ID}:${REGION}:${SQL_INSTANCE}"
          case "${BOOTSTRAP_OPERATION}" in
            plan|apply|adopt) ;;
            *)
              echo 'Operación no autorizada.' >&2
              exit 1
              ;;
          esac
          if [ -z "${DB_BOOTSTRAP_EXPECT_INSTANCE:-}" ] || \
             [ "${DB_BOOTSTRAP_EXPECT_INSTANCE}" != "${expected}" ] || \
             [ "${TF_CONNECTION_NAME}" != "${expected}" ]; then
            echo 'Identidad Cloud SQL incompleta o inconsistente.' >&2
            exit 1
          fi

          proxy_bin="${RUNNER_TEMP}/cloud-sql-proxy"
          proxy_log="${RUNNER_TEMP}/schema-plan-proxy.log"
          proxy_pid=''
          cleanup() {
            if [ -n "${proxy_pid}" ]; then
              kill "${proxy_pid}" 2>/dev/null || true
              wait "${proxy_pid}" 2>/dev/null || true
            fi
            unset DB_PASSWORD || true
            rm -f "${proxy_log}"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # El único argumento de instancia al proxy es el valor ya contrastado.
          "${proxy_bin}" --address '127.0.0.1' --port "${DB_PORT}" \
            "${DB_BOOTSTRAP_EXPECT_INSTANCE}" > "${proxy_log}" 2>&1 &
          proxy_pid=$!

          ready=0
          for _ in $(seq 1 30); do
            if ! kill -0 "${proxy_pid}" 2>/dev/null; then
              echo 'El Auth Proxy terminó antes de estar disponible.' >&2
              exit 1
            fi
            mapfile -t listeners < <(ss -H -ltnp "sport = :${DB_PORT}" || true)
            if [ "${#listeners[@]}" -eq 1 ]; then
              local_addr="$(awk '{print $4}' <<< "${listeners[0]}")"
              listener_pid="$(sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' <<< "${listeners[0]}")"
              if [ "${local_addr}" = "127.0.0.1:${DB_PORT}" ] && [ "${listener_pid}" = "${proxy_pid}" ]; then
                ready=1
                break
              fi
            fi
            sleep 1
          done
          if [ "${ready}" -ne 1 ]; then
            echo 'El proceso del Auth Proxy no es el único que escucha en 127.0.0.1.' >&2
            exit 1
          fi

          cmdline="$(tr '\0' '\n' < "/proc/${proxy_pid}/cmdline")"
          printf '%s\n' "${cmdline}" | grep -Fxq -- "${DB_BOOTSTRAP_EXPECT_INSTANCE}"
          printf '%s\n' "${cmdline}" | grep -Fxq -- '--address'
          printf '%s\n' "${cmdline}" | grep -Fxq -- '127.0.0.1'
          printf '%s\n' "${cmdline}" | grep -Fxq -- '--port'
          printf '%s\n' "${cmdline}" | grep -Fxq -- "${DB_PORT}"
          if printf '%s\n' "${cmdline}" | grep -q 'auto-iam-authn'; then
            echo 'El Auth Proxy no debe usar autenticación IAM de base de datos.' >&2
            exit 1
          fi
          if ! kill -0 "${proxy_pid}" 2>/dev/null; then
            echo 'El Auth Proxy no sigue activo antes de la inspección.' >&2
            exit 1
          fi

          # La contraseña solo vive en este proceso y en el subproceso Node.
          DB_PASSWORD="$(gcloud secrets versions access latest \
            --secret="${SECRET_ID}" --project="${PROJECT_ID}")"
          case "${DB_PASSWORD}" in
            ''|*$'\n'*|*$'\r'*)
              echo 'Secret Manager no devolvió una contraseña válida.' >&2
              exit 1
              ;;
          esac
          echo "::add-mask::${DB_PASSWORD}"
          export DB_PASSWORD

          # BEGIN decide
          decide() {
            case "${BOOTSTRAP_OPERATION}" in
              plan)
                case "${ACTION}" in
                  apply|adoption-required|already-applied) printf '%s\n' plan-ok ;;
                  incompatible) printf '%s\n' plan-incompatible ;;
                  *) printf '%s\n' invalid ;;
                esac
                ;;
              apply)
                case "${ACTION}" in
                  apply) printf '%s\n' apply-authorized ;;
                  *) printf '%s\n' apply-refused ;;
                esac
                ;;
              adopt)
                case "${ACTION}" in
                  adoption-required) printf '%s\n' adopt-disabled ;;
                  *) printf '%s\n' adopt-refused ;;
                esac
                ;;
              *)
                printf '%s\n' invalid
                ;;
            esac
          }
          # END decide

          read_cli_result() {
            if grep -F -q -- "${DB_PASSWORD}" <<< "${cli_output}"; then
              echo 'La salida del comando contiene material sensible.' >&2
              exit 1
            fi
            if ! kill -0 "${proxy_pid}" 2>/dev/null; then
              echo 'El Auth Proxy terminó durante la inspección.' >&2
              exit 1
            fi
            declared="$(printf '%s\n' "${cli_output}" | sed -n 's/^instanciaEsperada=//p')"
            action="$(printf '%s\n' "${cli_output}" | sed -n 's/^accion=//p')"
            declared_count="$(printf '%s\n' "${declared}" | grep -c . || true)"
            action_count="$(printf '%s\n' "${action}" | grep -c . || true)"
            if [ "${declared_count}" -ne 1 ] || [ "${action_count}" -ne 1 ]; then
              echo "La inspección falló (código ${cli_exit})." >&2
              exit 1
            fi
            if [ "${declared}" != "${expected}" ]; then
              echo 'El comando no declaró la instancia autorizada.' >&2
              exit 1
            fi
            case "${action}" in
              apply|adoption-required|already-applied|incompatible) ;;
              *)
                echo 'La clasificación devuelta no está reconocida.' >&2
                exit 1
                ;;
            esac
            if [ "${action}" = "incompatible" ]; then
              if [ "${cli_exit}" -eq 0 ]; then
                echo 'Una clasificación incompatible no puede terminar en éxito.' >&2
                exit 1
              fi
            elif [ "${cli_exit}" -ne 0 ]; then
              echo "La inspección falló (código ${cli_exit})." >&2
              exit 1
            fi
            ACTION="${action}"
          }

          publish() {
            echo "instanciaEsperada=${expected}"
            echo "accion=${ACTION}"
            {
              echo "### Esquema Cloud SQL"
              echo ""
              echo "- Operación solicitada: \`${BOOTSTRAP_OPERATION}\`"
              echo "- Clasificación: \`${ACTION}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          run_plan() {
            set +e
            cli_output="$(env -u CLOUD_SQL_CONNECTION_NAME -u DB_PASSWORD_FILE \
              npm run schema:bootstrap -- plan 2>&1)"
            cli_exit=$?
            set -e
            read_cli_result
          }

          run_plan
          decision="$(decide)"
          case "${decision}" in
            plan-ok)
              publish
              ;;
            plan-incompatible)
              publish
              exit 1
              ;;
            apply-refused|adopt-refused|invalid)
              publish
              echo 'La operación solicitada no está autorizada por la clasificación.' >&2
              exit 1
              ;;
            adopt-disabled)
              publish
              case "${BACKUP_ENABLED:-}" in
                true|false|absent|unrecognized) ;;
                *)
                  echo 'El estado de backup no es verificable.' >&2
                  exit 1
                  ;;
              esac
              case "${BINARY_LOG_ENABLED:-}" in
                true|false|absent|unrecognized) ;;
                *)
                  echo 'El estado del binary log no es verificable.' >&2
                  exit 1
                  ;;
              esac
              echo "ADOPT está deshabilitado. BACKUP_ENABLED=${BACKUP_ENABLED} BINARY_LOG_ENABLED=${BINARY_LOG_ENABLED}. Esos indicadores no demuestran un respaldo restaurado y la confirmación de texto no autoriza la escritura." >&2
              exit 1
              ;;
            apply-authorized)
              if [ "${DB_NAME}" != "sports_db" ] || [ "${BOOTSTRAP_OPERATION}" != "apply" ]; then
                echo 'La base o la operación no autorizan la escritura.' >&2
                exit 1
              fi
              set +e
              cli_output="$(env -u CLOUD_SQL_CONNECTION_NAME -u DB_PASSWORD_FILE \
                npm run schema:bootstrap -- apply --confirm sports_db 2>&1)"
              cli_exit=$?
              set -e
              if grep -F -q -- "${DB_PASSWORD}" <<< "${cli_output}"; then
                echo 'La salida del comando contiene material sensible.' >&2
                exit 1
              fi
              if [ "${cli_exit}" -ne 0 ]; then
                echo 'La escritura no terminó. No se repara el esquema.' >&2
                exit 1
              fi
              read_cli_result
              if [ "${ACTION}" != "already-applied" ]; then
                echo 'La escritura no dejó el esquema esperado. No se repara.' >&2
                exit 1
              fi
              run_plan
              if [ "${ACTION}" != "already-applied" ]; then
                echo 'La verificación posterior no confirmó el esquema. No se repara.' >&2
                exit 1
              fi
              # already-applied exige la versión y el checksum del módulo compilado.
              # Esta comparación fija ese módulo al DDL revisado.
              checksum="$(node -e "const schema=require('./dist/schema/canonical-schema.js'); if (schema.BOOTSTRAP_VERSION!==process.env.EXPECTED_SCHEMA_VERSION) process.exit(2); process.stdout.write(schema.applicationChecksum());")"
              if [ "${checksum}" != "${EXPECTED_SCHEMA_CHECKSUM}" ]; then
                echo 'El checksum compilado no coincide con el DDL esperado.' >&2
                exit 1
              fi
              publish
              echo "version=${EXPECTED_SCHEMA_VERSION}"
              echo "checksum=${checksum}"
              ;;
            *)
              echo 'La decisión de la operación no está reconocida.' >&2
              exit 1
              ;;
          esac
