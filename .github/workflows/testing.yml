name: Testing Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Build, Tests and Coverage
    runs-on: ubuntu-latest
    environment: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run automated tests
        run: npm test

      - name: Validate testing coverage
        run: npm run test:coverage:testing