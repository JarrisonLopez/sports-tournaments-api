name: Chaos Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/chaos/**"
      - "src/resilience/**"
      - "src/clients/hotel.client.ts"
      - "scripts/chaos/**"
      - "chaos/**"
      - ".github/workflows/chaos-gate.yml"
  push:
    branches:
      - feature/seguimiento-4-chaos-aws

jobs:
  chaos-lab:
    name: Local chaos lab (mocks)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests (chaos + resilience)
        run: |
          npx vitest run \
            tests/unit/hotel-latency-fault.test.ts \
            tests/unit/timeout.test.ts \
            tests/unit/circuit-breaker.test.ts \
            tests/unit/hotel-resilience.test.ts \
            tests/integration/chaos-hotel-latency.routes.test.ts \
            tests/unit/flujo-sequential.test.ts

      - name: Build TypeScript
        run: npm run build

      - name: Preflight steady-state (compile + fault module reset)
        run: node -e "console.log('preflight ok')"

      - name: Run Baseline/R0/R1 against HTTP mocks
        env:
          CHAOS_HOTEL_LATENCY_MS: "800"
          HOTEL_TIMEOUT_MS: "300"
          CHAOS_ROUND_REQUESTS: "24"
          CHAOS_ROUND_CONCURRENCY: "8"
          CHAOS_SLO_MS: "500"
        run: node scripts/chaos/run_rounds.mjs

      - name: Evaluate thresholds from rounds-latest.json
        run: |
          node <<'EOF'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('chaos/results/rounds-latest.json', 'utf8'));
          const { baseline, r0, r1, comparison } = report;
          if (!(r0.p95Ms > baseline.p95Ms * 1.5)) {
            console.error('FAIL: R0 did not degrade p95 vs baseline');
            process.exit(1);
          }
          const improved =
            (r1.p95Ms != null && r0.p95Ms != null && r1.p95Ms < r0.p95Ms * 0.7) ||
            (r1.withinSloRate > r0.withinSloRate + 0.2) ||
            (r1.wallClockMs < r0.wallClockMs * 0.7);
          if (!improved) {
            console.error('FAIL: R1 did not improve p95/SLO/wall vs R0');
            process.exit(1);
          }
          console.log('Chaos gate PASS');
          console.log(JSON.stringify(comparison, null, 2));
          EOF

      - name: Upload chaos results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-results
          path: chaos/results/
          if-no-files-found: warn
