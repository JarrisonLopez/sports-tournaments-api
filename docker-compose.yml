services:
  mysql:
    image: mysql:8.4
    container_name: sports-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sports_db
      MYSQL_USER: sports_user
      MYSQL_PASSWORD: sports_password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: