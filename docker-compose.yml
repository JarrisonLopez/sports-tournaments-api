services:
  mysql:
    image: mysql:8.4
    container_name: sports-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sports_db
      MYSQL_USER: sports_user
      MYSQL_PASSWORD: sports_password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sports-api
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: sports_user
      DB_PASSWORD: sports_password
      DB_NAME: sports_db

    ports:
      - "3000:3000"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: