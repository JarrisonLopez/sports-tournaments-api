apiVersion: apps/v1
kind: Deployment
metadata:
  name: sports-tournaments-api
  labels:
    app: sports-tournaments-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: sports-tournaments-api
  template:
    metadata:
      labels:
        app: sports-tournaments-api
    spec:
      serviceAccountName: sports-api-ksa
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: sports-tournaments-api
              topologyKey: kubernetes.io/hostname
      containers:
        - name: sports-tournaments-api
          # Sports API image stored in Artifact Registry.
          image: us-central1-docker.pkg.dev/sports-tournaments-multicloud/sports-tournaments/sports-tournaments-api:da834b7
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_PASSWORD_FILE
              value: /var/secrets/db-password
          envFrom:
            - configMapRef:
                name: sports-api-config
          volumeMounts:
            - name: cloudsql
              mountPath: /cloudsql
            - name: secrets-store
              mountPath: /var/secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4
          args:
            - "--unix-socket=/cloudsql"
            - "--structured-logs"
            - "sports-tournaments-multicloud:us-central1:sports-mysql"
          securityContext:
            runAsNonRoot: true
          volumeMounts:
            - name: cloudsql
              mountPath: /cloudsql
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: cloudsql
          emptyDir: {}
        - name: secrets-store
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sports-api-secrets-gke
