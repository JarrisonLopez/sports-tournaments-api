apiVersion: v1
kind: ConfigMap
metadata:
  name: sports-api-config
  namespace: sports-lab
data:
  PORT: "8080"
  DB_HOST: sports-mysql
  DB_PORT: "3306"
  DB_USER: sports_user
  DB_NAME: sports_db
  API_VERSION: "4.1.1"
  API_TRACK: "stable"
  # Multicloud real (Samuel OCI / Daniel GCP). Rollback: k8s/aws/configmap.lab-mocks.yaml
  HOTEL_API_URL: "http://149.130.165.30"
  CINE_API_URL: "http://35.239.107.54"
  OBJECT_STORAGE_API_URL: ""
  # OTLP → Collector OCI (Samuel). SAN del cert: DNS otel-lab.local + IP 157.137.233.183
  # (CN hotel-otel-lab NO está en SAN → no usarlo como host TLS).
  # No incluir /v1/traces ni /v1/metrics: el exporter las añade.
  OTEL_SERVICE_NAME: "sports-api"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-lab.local:31443"
  OTEL_EXPORTER_OTLP_CERTIFICATE: "/etc/otel/otel-lab-ca.crt"
  FLUJO_ORCHESTRATION_MODE: "sequential"
  HOTEL_TIMEOUT_MS: "2000"
  HOTEL_FALLBACK_ENABLED: "true"
  RESILIENCE_ENABLED: "true"
  CHAOS_LAB_ENABLED: "false"
