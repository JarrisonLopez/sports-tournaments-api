apiVersion: v1
kind: ConfigMap
metadata:
  name: sports-api-config
  namespace: sports-lab
data:
  PORT: "8080"
  DB_HOST: sports-mysql
  DB_PORT: "3306"
  DB_USER: sports_user
  DB_NAME: sports_db
  API_VERSION: "4.1.0"
  API_TRACK: "stable"
  # Sustituir por URLs reales de Samuel (OCI) y Daniel (GCP) cuando existan.
  HOTEL_API_URL: "http://hotel-mock:8081"
  CINE_API_URL: "http://cine-mock:8082"
  OBJECT_STORAGE_API_URL: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  FLUJO_ORCHESTRATION_MODE: "sequential"
  HOTEL_TIMEOUT_MS: "2000"
  RESILIENCE_ENABLED: "true"
  CHAOS_LAB_ENABLED: "false"
