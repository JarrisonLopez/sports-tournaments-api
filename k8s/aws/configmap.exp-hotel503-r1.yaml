# Experimento Hotel OCI HTTP 503 — R1 con timeout + CB + fallback.
# CHAOS_LAB_ENABLED=false: el fallo lo activa Samuel en OCI (no latencia Sports).
# Conserva Hotel OCI + Cine GCP reales + OTLP.
# Temporal → restaurar k8s/aws/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: sports-api-config
  namespace: sports-lab
data:
  PORT: "8080"
  DB_HOST: sports-mysql
  DB_PORT: "3306"
  DB_USER: sports_user
  DB_NAME: sports_db
  API_VERSION: "4.1.1"
  API_TRACK: "stable"
  HOTEL_API_URL: "http://149.130.165.30"
  CINE_API_URL: "http://35.239.107.54"
  OBJECT_STORAGE_API_URL: ""
  OTEL_SERVICE_NAME: "sports-api"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-lab.local:31443"
  OTEL_EXPORTER_OTLP_CERTIFICATE: "/etc/otel/otel-lab-ca.crt"
  FLUJO_ORCHESTRATION_MODE: "sequential"
  HOTEL_TIMEOUT_MS: "2000"
  HOTEL_FALLBACK_ENABLED: "true"
  RESILIENCE_ENABLED: "true"
  CHAOS_LAB_ENABLED: "false"
  HOTEL_CB_FAILURE_THRESHOLD: "3"
  HOTEL_CB_OPEN_MS: "10000"
  HOTEL_CB_SUCCESS_THRESHOLD: "1"
