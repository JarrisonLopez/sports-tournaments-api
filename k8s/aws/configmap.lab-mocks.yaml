# Rollback de laboratorio: apunta a mocks en sports-lab (no OCI/GCP).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sports-api-config
  namespace: sports-lab
data:
  PORT: "8080"
  DB_HOST: sports-mysql
  DB_PORT: "3306"
  DB_USER: sports_user
  DB_NAME: sports_db
  API_VERSION: "4.1.1"
  API_TRACK: "stable"
  HOTEL_API_URL: "http://hotel-mock:8081"
  CINE_API_URL: "http://cine-mock:8082"
  OBJECT_STORAGE_API_URL: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  FLUJO_ORCHESTRATION_MODE: "sequential"
  HOTEL_TIMEOUT_MS: "400"
  HOTEL_FALLBACK_ENABLED: "true"
  RESILIENCE_ENABLED: "true"
  CHAOS_LAB_ENABLED: "false"
