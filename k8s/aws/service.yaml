apiVersion: v1
kind: Service
metadata:
  name: sports-tournaments-api
  namespace: sports-lab
  labels:
    app: sports-tournaments-api
spec:
  type: NodePort
  selector:
    app: sports-tournaments-api
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
      nodePort: 30080
