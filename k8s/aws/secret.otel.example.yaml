# Ejemplo — NO commitear valores reales.
# Aplicar con scripts/otel/apply-oci-collector-secrets.ps1
#
# sports-otel-secrets:
#   OTEL_EXPORTER_OTLP_HEADERS = Authorization=Basic <base64(otel-lab:TOKEN)>
#
# sports-otel-ca:
#   otel-lab-ca.crt = PEM del CA de Samuel
---
apiVersion: v1
kind: Secret
metadata:
  name: sports-otel-secrets
  namespace: sports-lab
type: Opaque
stringData:
  OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic REPLACE_WITH_BASE64_USER_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: sports-otel-ca
  namespace: sports-lab
type: Opaque
stringData:
  otel-lab-ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_SAMUEL_CA_PEM
    -----END CERTIFICATE-----
