apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sports-mysql-pvc
  namespace: sports-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sports-mysql
  namespace: sports-lab
  labels:
    app: sports-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sports-mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sports-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: sports-api-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: sports-api-config
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sports-api-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sports-api-secrets
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sports-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sports-mysql
  namespace: sports-lab
spec:
  selector:
    app: sports-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
