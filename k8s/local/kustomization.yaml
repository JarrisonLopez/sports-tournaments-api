apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sports-lab
resources:
  - ../aws/namespace.yaml
  - ../aws/configmap.yaml
  - ../aws/mysql/deployment.yaml
  - ../aws/deployment.yaml
  - ../aws/service.yaml
patches:
  - target:
      kind: Deployment
      name: sports-tournaments-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: sports-tournaments-api:local
